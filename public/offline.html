<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoCheat AI — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0a1e;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #e2d9f3;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      background: rgba(109,40,217,0.08);
      border: 1px solid rgba(109,40,217,0.3);
      border-radius: 20px;
      padding: 48px 36px;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: #6d28d9;
      background: rgba(109,40,217,0.15);
      border: 1px solid rgba(109,40,217,0.4);
      border-radius: 20px;
      padding: 6px 16px;
      letter-spacing: 0.5px;
    }
    button {
      margin-top: 24px;
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>AlgoCheat AI needs a connection to run your LinkedIn audits. Reconnect and your session will pick up right where you left it.</p>
    <div class="badge">AlgoCheat AI · Algorithm Intelligence</div>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
